{% extends "_auth_base.html" %}
{% block title %}Log in{% endblock %}
{% block body %}
<h1>Welcome back</h1>
<p class="muted">Log in to reconnect with your network.</p>
<form method="post">
  <input type="hidden" name="_csrf" value="{{ csrf_token() }}" />
  <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" required autocomplete="email" placeholder="you@example.com" /></div>
  <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" required autocomplete="current-password" placeholder="••••••••" /></div>
  <button class="btn btn-primary btn-block">Log in</button>
</form>
<p class="muted" style="margin-top:18px;text-align:center">New here? <a class="link" href="{{ url_for('auth.register') }}">Create an account</a></p>
<div class="demo-box"><strong style="color:var(--c-text)">Demo accounts</strong> (password <code>password123</code>)<br />
  <div style="margin-top:8px"><button type="button" data-fill="student@test.com|password123">Student</button><button type="button" data-fill="alumni@test.com|password123">Alumni</button><button type="button" data-fill="admin@test.com|password123">Admin</button></div></div>
{% endblock %}
