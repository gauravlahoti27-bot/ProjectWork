<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}{% endblock %} · Alumni Nexus AI</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/animations.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}" />
</head>
<body>
  <div class="flashes">{% for cat, msg in get_flashed_messages(with_categories=true) %}<div class="flash {{ cat }}"><span>{{ msg }}</span><button type="button" aria-label="Dismiss">×</button></div>{% endfor %}</div>
  <div class="auth-wrap"><div class="auth-card glass">
    <a href="{{ url_for('home') }}" class="brand"><span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><circle cx="5" cy="6" r="2"/><circle cx="19" cy="6" r="2"/><circle cx="12" cy="18" r="2"/><path d="M6.7 7.3 10.5 16M17.3 7.3 13.5 16M7 6h10"/></svg></span>Alumni <span>Nexus</span>&nbsp;AI</a>
    {% block body %}{% endblock %}
  </div></div>
  <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
</body>
</html>
