<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account — TrekMate</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body style="background-color: #f1f5f9;">
    <div th:replace="~{fragments/navbar :: headerNav}"></div>

    <main style="display:flex; align-items:center; justify-content:center; min-height:80vh; padding:40px 0;">
        <div class="card" style="width:100%; max-width:500px; padding:32px; box-shadow:var(--shadow-md);">
            <div style="text-align:center; margin-bottom:24px;">
                <span style="font-size:2.5rem;">⛰️</span>
                <h2 style="font-size:1.6rem; color:var(--primary-dark); margin-top:8px;">Join TrekMate</h2>
                <p style="color:var(--text-muted); font-size:0.9rem;">Register as a Trekker or Expedition Host</p>
            </div>

            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

            <form th:action="@{/register}" method="post">
                <div class="form-group">
                    <label class="form-label">Full Name</label>
                    <input type="text" name="fullName" class="form-control" placeholder="e.g. Aryan Sharma" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <input type="email" name="email" class="form-control" placeholder="name@example.com" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" placeholder="Choose a secure password" required minlength="4">
                </div>

                <div class="form-group">
                    <label class="form-label">Phone Number</label>
                    <input type="tel" name="phone" class="form-control" placeholder="+91 9876543210">
                </div>

                <div class="form-group">
                    <label class="form-label">Account Role</label>
                    <select name="role" class="form-control" required>
                        <option value="USER" selected>🎒 Trekker (Gets ₹35,000 Free Virtual Demo Credits)</option>
                        <option value="HOST">👑 Trek Leader / Host (Can add treks, manage slots & approve bookings)</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-accent" style="width:100%; margin-top:10px;">Create Account</button>
            </form>

            <div style="text-align:center; margin-top:20px; font-size:0.9rem; color:var(--text-muted);">
                Already registered? <a href="/login" style="font-weight:600;">Sign in here</a>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/navbar :: footer}"></div>
</body>
</html>
