<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — TrekMate</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body style="background-color: #f1f5f9;">
    <div th:replace="~{fragments/navbar :: headerNav}"></div>

    <main style="display:flex; align-items:center; justify-content:center; min-height:75vh;">
        <div class="card" style="width:100%; max-width:440px; padding:32px; box-shadow:var(--shadow-md);">
            <div style="text-align:center; margin-bottom:24px;">
                <span style="font-size:2.5rem;">⛰️</span>
                <h2 style="font-size:1.6rem; color:var(--primary-dark); margin-top:8px;">Welcome to TrekMate</h2>
                <p style="color:var(--text-muted); font-size:0.9rem;">Sign in to plan treks, manage wallet & bookings</p>
            </div>

            <!-- Flash alerts -->
            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
            <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
            <div th:if="${infoMessage}" class="alert alert-info" th:text="${infoMessage}"></div>

            <form th:action="@{/login}" method="post">
                <input type="hidden" name="redirect" th:value="${redirect}">

                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <input type="email" id="loginEmail" name="email" class="form-control" placeholder="name@example.com" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" id="loginPassword" name="password" class="form-control" placeholder="Enter your password" required>
                </div>

                <button type="submit" class="btn btn-primary" style="width:100%; margin-top:8px;">Sign In</button>
            </form>

            <!-- Quick Demo Credentials Fill -->
            <div style="margin-top:24px; padding:16px; background-color:#f8f9fa; border-radius:8px; border:1px solid #e2e8f0; text-align:center;">
                <p style="font-size:0.8rem; font-weight:700; color:var(--text-muted); text-transform:uppercase; margin-bottom:10px;">
                    Demo Quick Login (1-Click)
                </p>
                <div style="display:flex; gap:8px;">
                    <button type="button" class="btn btn-outline btn-sm" style="flex:1;" onclick="quickLogin('trekker@example.com', 'pass123')">
                        🎒 Trekker Login
                    </button>
                    <button type="button" class="btn btn-outline btn-sm" style="flex:1;" onclick="quickLogin('host@example.com', 'admin123')">
                        👑 Host Login
                    </button>
                </div>
            </div>

            <div style="text-align:center; margin-top:20px; font-size:0.9rem; color:var(--text-muted);">
                Don't have an account? <a href="/register" style="font-weight:600;">Sign up here</a>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/navbar :: footer}"></div>

    <script>
        function quickLogin(email, password) {
            document.getElementById("loginEmail").value = email;
            document.getElementById("loginPassword").value = password;
        }
    </script>
</body>
</html>
