<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Treks — Host Portal | TrekMate</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <div th:replace="~{fragments/navbar :: headerNav}"></div>

    <main>
        <div class="container">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:28px;">
                <div>
                    <a href="/host/dashboard" style="font-size:0.85rem; color:var(--text-muted);">&larr; Back to Host Dashboard</a>
                    <h1 style="font-size:2rem; color:var(--primary-dark); margin-top:4px;">Manage Trek Packages</h1>
                    <p style="color:var(--text-muted);">Add new expeditions, update details, manage pricing, and toggle status.</p>
                </div>
                <a href="/host/treks/add" class="btn btn-accent">+ Add New Trek</a>
            </div>

            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
            <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

            <div class="card" style="padding:24px;">
                <div class="table-responsive">
                    <table class="custom-table">
                        <thead>
                            <tr>
                                <th>Trek Title</th>
                                <th>Destination</th>
                                <th>Difficulty</th>
                                <th>Duration</th>
                                <th>Base Price</th>
                                <th>Altitude</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="t : ${treks}">
                                <td><strong th:text="${t.title}">Kedarkantha</strong></td>
                                <td th:text="${t.destination + ', ' + t.state}">Uttarkashi</td>
                                <td>
                                    <span class="badge" th:classappend="'badge-' + ${#strings.toLowerCase(t.difficulty)}" th:text="${t.difficulty}">Easy</span>
                                </td>
                                <td th:text="${t.durationFormatted}">6D / 5N</td>
                                <td><strong th:text="'₹' + ${#numbers.formatDecimal(t.basePrice, 1, 'COMMA', 2, 'POINT')}">₹9,200.00</strong></td>
                                <td th:text="${t.altitudeMeters + ' m'}">3,810 m</td>
                                <td>
                                    <span th:if="${t.active}" class="badge badge-approved">ACTIVE</span>
                                    <span th:if="${!t.active}" class="badge badge-cancelled">INACTIVE</span>
                                </td>
                                <td>
                                    <div style="display:flex; gap:6px;">
                                        <a th:href="@{'/host/treks/edit/' + ${t.id}}" class="btn btn-outline btn-sm">Edit</a>
                                        <form th:if="${t.active}" th:action="@{'/host/treks/delete/' + ${t.id}}" method="post"
                                              onsubmit="return confirm('Deactivate this trek?');">
                                            <button type="submit" class="btn btn-danger btn-sm">Deactivate</button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/navbar :: footer}"></div>
</body>
</html>
